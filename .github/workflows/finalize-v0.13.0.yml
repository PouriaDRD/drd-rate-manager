name: Finalize v0.13.0 worker

on:
  push:
    paths:
      - ".upload/READY"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild worker
        run: |
          cat .upload/worker.part* > worker.js
          node --check worker.js
          HASH="$(git hash-object worker.js)"
          test "$HASH" = "6f9facaab7f1e7c20522e7979e5785a042c44b6e"

      - name: Clean staging files
        run: |
          rm -rf .upload
          rm -f .github/workflows/finalize-v0.13.0.yml

      - name: Commit final v0.13.0 worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.13.0 — Rebuild DRD Rate Manager architecture"
          git push
